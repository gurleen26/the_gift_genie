<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiftGenie AI — Create Account</title>
<style>
  :root{
    --bg-deep:#0a0d1f;
    --bg-mid:#140f2e;
    --card-bg:#f5f3f7;
    --card-bg-soft:#ffffff;
    --ink:#241f33;
    --muted:#6b6478;
    --pink:#ec4899;
    --purple:#a855f7;
    --gradient: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
    --ring: rgba(168,85,247,0.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 15% 20%, #2a1d52 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, #5b1f4a 0%, transparent 50%),
                linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
    color: var(--ink);
    overflow-x:hidden;
  }

  .stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .star{
    position:absolute;
    width:3px;
    height:3px;
    background:#fff;
    border-radius:50%;
    opacity:0.5;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(0.8); }
    50%{ opacity:0.85; transform:scale(1.3); }
  }

  .page{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .card{
    width:100%;
    max-width:440px;
    background: var(--card-bg);
    border-radius:28px;
    padding:48px 40px 40px;
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.04);
    text-align:center;
    position:relative;
  }

  .badge{
    width:84px;
    height:84px;
    margin:0 auto 22px;
    border-radius:20px;
    background: var(--gradient);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 18px 40px -10px rgba(168,85,247,0.55);
    position:relative;
  }
  .badge::after{
    content:"";
    position:absolute;
    inset:-14px;
    border-radius:28px;
    background: var(--gradient);
    opacity:0.35;
    filter:blur(18px);
    z-index:-1;
  }
  .badge svg{
    width:38px;
    height:38px;
    stroke:#fff;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  h1{
    font-size:30px;
    line-height:1.15;
    margin:0 0 8px;
    font-weight:800;
    letter-spacing:-0.02em;
    background: var(--gradient);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .sub{
    margin:0 0 32px;
    font-size:14.5px;
    color: var(--muted);
    line-height:1.5;
  }

  form{
    display:flex;
    flex-direction:column;
    gap:16px;
    text-align:left;
  }

  .field{
    position:relative;
  }

  .field svg{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    stroke: var(--muted);
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    pointer-events:none;
  }

  input{
    width:100%;
    padding:15px 18px 15px 48px;
    border-radius:999px;
    border:1.5px solid #e3dfe9;
    background: var(--card-bg-soft);
    font-size:15px;
    color: var(--ink);
    outline:none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  input::placeholder{ color:#a8a3b5; }
  input:focus{
    border-color: var(--purple);
    box-shadow: 0 0 0 4px var(--ring);
  }

  button{
    margin-top:8px;
    padding:16px 18px;
    border:none;
    border-radius:999px;
    background: var(--gradient);
    color:#fff;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.01em;
    cursor:pointer;
    box-shadow: 0 14px 30px -8px rgba(168,85,247,0.55);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  button:hover{
    transform: translateY(-2px);
    box-shadow: 0 18px 36px -8px rgba(168,85,247,0.65);
    filter:brightness(1.04);
  }
  button:active{ transform: translateY(0); }
  button:focus-visible{
    outline:3px solid var(--purple);
    outline-offset:3px;
  }

  .switch{
    margin-top:26px;
    font-size:14px;
    color: var(--muted);
  }
  .switch a{
    color: var(--purple);
    font-weight:700;
    text-decoration:none;
  }
  .switch a:hover{ text-decoration:underline; }

  .wordmark{
    margin-top:30px;
    font-size:12.5px;
    color:#a8a3b5;
    letter-spacing:0.04em;
  }
  .wordmark b{
    background: var(--gradient);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  @media (max-width:480px){
    .card{ padding:38px 26px 32px; border-radius:22px; }
    h1{ font-size:26px; }
  }

  @media (prefers-reduced-motion: reduce){
    .star{ animation:none; opacity:0.4; }
    button{ transition:none; }
  }
</style>
</head>

<body>

  <div class="stars" id="stars"></div>

  <div class="page">
    <div class="card">
      <div class="badge">
        <svg viewBox="0 0 24 24">
          <path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8L19 13M15 4l2.5-2.5M11.5 17.5L4 25M9 6.5l2.5 2.5"/>
          <path d="M3 21l8-8"/>
        </svg>
      </div>

      <h1>Create your account</h1>
      <p class="sub">Join GiftGenie and let AI find the gift they'll actually love.</p>

      <form method="POST">
        <div class="field">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
          <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M3 7l9 6 9-6M3 7v10a2 2 0 002 2h14a2 2 0 002-2V7M3 7a2 2 0 012-2h14a2 2 0 012 2"/></svg>
          <input type="email" name="email" placeholder="Email" required>
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M7 11V7a5 5 0 0110 0v4M5 11h14v9H5z"/></svg>
          <input type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M11.5 17.5L4 25"/></svg>
          Create Account
        </button>
      </form>

      <p class="switch">
        Already have an account? <a href="/login">Log in</a>
      </p>

      <div class="wordmark"><b>GiftGenie AI</b> · gifts that feel found, not bought</div>
    </div>
  </div>

  <script>
    const starsContainer = document.getElementById('stars');
    const STAR_COUNT = 60;
    for (let i = 0; i < STAR_COUNT; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.animationDelay = (Math.random() * 3.5) + 's';
      const size = (Math.random() * 2 + 1.5).toFixed(1);
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      starsContainer.appendChild(s);
    }
  </script>

</body>
</html>
