<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiftGenie AI ✨ Smart Gift Recommendations</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
  :root {
    --primary: #ff4d7d;
    --primary-dark: #e63e6b;
    --secondary: #6366f1;
    --secondary-dark: #4f52e0;
    --accent: #8b5cf6;
    --dark: #1e293b;
    --light: #f8fafc;
    --gray: #94a3b8;
    --gradient-1: linear-gradient(135deg, #ff4d7d, #8b5cf6);
    --gradient-2: linear-gradient(135deg, #6366f1, #a855f7);
    --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
  }

  body {
    background: linear-gradient(135deg, #f0f9ff 0%, #fdf4f5 50%, #f0f2fe 100%);
    min-height: 100vh;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }

  /* Animated background elements */
  body::before {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(255,77,125,0.1) 0%, transparent 70%);
    top: -100px;
    right: -100px;
    border-radius: 50%;
    animation: float 15s infinite ease-in-out;
    z-index: 0;
  }

  body::after {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%);
    bottom: -150px;
    left: -150px;
    border-radius: 50%;
    animation: float 18s infinite ease-in-out reverse;
    z-index: 0;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, 20px) scale(1.1); }
    66% { transform: translate(-20px, 30px) scale(0.9); }
  }

  .container {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    max-width: 1000px;
    width: 100%;
    padding: 50px;
    border-radius: 48px;
    box-shadow: var(--shadow-xl), 0 0 0 1px rgba(255,255,255,0.5) inset;
    position: relative;
    z-index: 1;
    animation: slideUp 0.6s ease-out;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .brand {
    text-align: center;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .brand-icon {
    width: 50px;
    height: 50px;
    background: var(--gradient-1);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-md);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .brand-icon i {
    font-size: 28px;
    color: white;
  }

  .brand-text h2 {
    font-size: 28px;
    font-weight: 800;
    background: var(--gradient-1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .brand-text p {
    color: var(--gray);
    font-weight: 500;
    font-size: 14px;
  }

  h1 {
    text-align: center;
    margin-bottom: 12px;
    color: var(--dark);
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.2;
  }

  .subtitle {
    text-align: center;
    color: var(--gray);
    margin-bottom: 40px;
    font-size: 18px;
    font-weight: 400;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 20px;
    position: relative;
  }

  .form-group.full-width {
    grid-column: span 2;
  }

  label {
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    color: var(--dark);
    font-size: 15px;
    transition: all 0.3s;
  }

  label i {
    color: var(--primary);
    font-size: 16px;
  }

  .input-wrapper {
    position: relative;
    transition: all 0.3s;
  }

  .input-wrapper:focus-within {
    transform: translateY(-2px);
  }

  textarea, input {
    width: 100%;
    padding: 16px 18px;
    border-radius: 20px;
    border: 2px solid #e2e8f0;
    font-size: 16px;
    transition: all 0.3s;
    background: white;
    font-weight: 500;
  }

  textarea {
    min-height: 120px;
    resize: vertical;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(255,77,125,0.1);
  }

  input:hover, textarea:hover {
    border-color: var(--gray);
  }

  /* Interactive floating label effect */
  .input-wrapper.floating {
    position: relative;
  }

  .input-wrapper.floating input:focus + label,
  .input-wrapper.floating input:not(:placeholder-shown) + label {
    transform: translateY(-25px) scale(0.8);
    color: var(--primary);
  }

  .budget-hint {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gray);
    font-size: 14px;
    font-weight: 500;
    pointer-events: none;
  }

  button {
    width: 100%;
    padding: 18px 24px;
    background: var(--gradient-1);
    color: white;
    border: none;
    border-radius: 30px;
    font-weight: 700;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }

  button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
  }

  button:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-xl);
  }

  button:hover::before {
    left: 100%;
  }

  button i {
    font-size: 20px;
    transition: transform 0.3s;
  }

  button:hover i {
    transform: translateX(5px) rotate(10deg);
  }

  .gift-card {
    background: white;
    padding: 28px;
    border-radius: 32px;
    margin-top: 30px;
    box-shadow: var(--shadow-lg);
    border: 1px solid rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    animation: cardAppear 0.5s ease-out;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .gift-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: var(--gradient-1);
  }

  .gift-card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: var(--shadow-xl);
  }

  @keyframes cardAppear {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .gift-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
  }

  .gift-icon {
    width: 50px;
    height: 50px;
    background: var(--gradient-2);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 24px;
    transform: rotate(-5deg);
    transition: transform 0.3s;
  }

  .gift-card:hover .gift-icon {
    transform: rotate(0deg) scale(1.1);
  }

  .gift-card h3 {
    color: var(--dark);
    font-size: 24px;
    font-weight: 700;
    margin: 0;
  }

  .gift-desc {
    color: #4a5568;
    line-height: 1.7;
    margin-bottom: 20px;
    font-size: 16px;
    padding-left: 0;
  }

  .gift-meta {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .gift-meta-item {
    background: #f1f5f9;
    padding: 8px 16px;
    border-radius: 40px;
    font-size: 14px;
    font-weight: 600;
    color: var(--dark);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .gift-meta-item i {
    color: var(--primary);
  }

  .gift-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: var(--gradient-2);
    color: white;
    border-radius: 30px;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s;
    box-shadow: var(--shadow-sm);
  }

  .gift-link:hover {
    transform: translateX(5px);
    box-shadow: var(--shadow-md);
    background: var(--gradient-1);
  }

  .home-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 40px;
    color: var(--secondary);
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s;
    padding: 12px 24px;
    border-radius: 30px;
    background: white;
    box-shadow: var(--shadow-sm);
  }

  .home-link:hover {
    transform: translateX(-5px);
    box-shadow: var(--shadow-md);
    color: var(--primary);
  }

  /* Loading animation for form submission */
  .loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 1s ease-in-out infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .container { padding: 30px 20px; }
    h1 { font-size: 32px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full-width { grid-column: span 1; }
  }
</style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="brand-icon">
      <i class="fas fa-wand-magic-sparkles"></i>
    </div>
    <div class="brand-text">
      <h2>GiftGenie AI</h2>
      <p>intelligent gift discovery</p>
    </div>
  </div>

  <h1>Find the Perfect Gift 🎁</h1>
  <p class="subtitle">Tell us about them — our AI genie will find something magical</p>

  <form method="post" id="giftForm">
    <div class="form-grid">
      <div class="form-group full-width">
        <label><i class="fas fa-user"></i> About the person</label>
        <div class="input-wrapper">
          <textarea name="description" required 
            placeholder="e.g., My sister Emma is 28, loves cats, works as a graphic designer, enjoys coffee, cozy evenings with books, and has a quirky sense of humor..."></textarea>
        </div>
      </div>

      <div class="form-group">
        <label><i class="fas fa-calendar"></i> Age</label>
        <div class="input-wrapper">
          <input type="number" name="age" min="1" max="100" placeholder="e.g., 28" required>
        </div>
      </div>

      <div class="form-group">
        <label><i class="fas fa-coins"></i> Budget (USD)</label>
        <div class="input-wrapper">
          <input type="number" name="budget" min="5" placeholder="e.g., 50" required>
          <span class="budget-hint">max</span>
        </div>
      </div>
    </div>

    <button type="submit" id="submitBtn">
      <span>Generate Gift Ideas</span>
      <i class="fas fa-arrow-right"></i>
    </button>
  </form>

{% if suggestions %}
  {% for idea in suggestions %}
    {{ idea | safe }}
  {% endfor %}
{% endif %}

  <div style="text-align:center;">
    <a class="home-link" href="{{ url_for('index') }}">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>
  </div>

</div>
<script>
  const form = document.getElementById('giftForm');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function() {
    // Show loading state
    submitBtn.innerHTML = '<span class="loading"></span> Generating ideas...';
    submitBtn.disabled = true;
  });

  // Optional input focus effect (safe)
  const inputs = document.querySelectorAll('input, textarea');
  inputs.forEach(input => {
    input.addEventListener('focus', function() {
      this.parentElement.classList.add('focused');
    });
    input.addEventListener('blur', function() {
      this.parentElement.classList.remove('focused');
    });
  });
</script>

</body>
</html>
