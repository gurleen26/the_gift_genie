<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiftGenie AI | Smart Gift Discovery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: flex-start;
padding-top: 40px;
  background: #0d0d1a;
  position: relative;
}

/* ── Dark space background ── */
.bg-canvas {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse at 20% 20%, #1a0a2e 0%, #0d0d1a 50%, #0a1628 100%);
}

/* ── Aurora blobs ── */
.aurora {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  mix-blend-mode: screen;
}
.aurora-1 {
  width: 700px; height: 500px;
  background: radial-gradient(ellipse, rgba(255,77,125,0.35) 0%, transparent 70%);
  top: -180px; left: -180px;
  animation: aurora1 20s ease-in-out infinite alternate;
}
.aurora-2 {
  width: 600px; height: 600px;
  background: radial-gradient(ellipse, rgba(99,102,241,0.3) 0%, transparent 70%);
  bottom: -200px; right: -150px;
  animation: aurora2 24s ease-in-out infinite alternate;
}
.aurora-3 {
  width: 400px; height: 400px;
  background: radial-gradient(ellipse, rgba(139,92,246,0.25) 0%, transparent 70%);
  top: 35%; left: 35%;
  animation: aurora3 30s ease-in-out infinite alternate;
}
.aurora-4 {
  width: 350px; height: 350px;
  background: radial-gradient(ellipse, rgba(236,72,153,0.2) 0%, transparent 70%);
  top: 10%; right: 15%;
  animation: aurora1 18s ease-in-out infinite alternate-reverse;
}

@keyframes aurora1 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(60px,50px) scale(1.15)} }
@keyframes aurora2 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(-50px,-40px) scale(1.1)} }
@keyframes aurora3 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(80px,-60px) scale(1.2)} }

/* ── Star canvas ── */
.stars { position: absolute; inset: 0; pointer-events: none; }

/* ── Floating emoji gifts ── */
.float-emoji {
  position: absolute;
  pointer-events: none;
  animation: floatEmoji linear infinite;
  opacity: 0;
  z-index: 1;
  filter: drop-shadow(0 0 8px rgba(255,77,125,0.5));
}
@keyframes floatEmoji {
  0%   { transform: translateY(105vh) rotate(0deg); opacity: 0; }
  8%   { opacity: 0.8; }
  92%  { opacity: 0.6; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}

/* ── Hero Card - original styles preserved exactly ── */
.hero-card {
  position: relative;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  /* padding: 80px 100px; */
   padding: 40px 80px;
  border-radius: 48px;
  text-align: center;
  box-shadow: 
    0 30px 80px rgba(0, 0, 0, 0.1),
    0 0 0 1px rgba(255, 255, 255, 0.8) inset,
    0 20px 40px rgba(0, 0, 0, 0.05);
  max-width: 750px;
  width: 90%;
  animation: fadeUp 1s ease forwards;
  z-index: 10;
  overflow: hidden;
}

.hero-card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
  animation: rotate 20s linear infinite;
  z-index: -1;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes fadeUp {
  0% { 
    opacity: 0; 
    transform: translateY(40px) scale(0.95);
  }
  100% { 
    opacity: 1; 
    transform: translateY(0) scale(1);
  }
}

.icon-wrapper {
  width: 120px;
  height: 120px;
  margin: 0 auto 30px;
  background: linear-gradient(135deg, #ff4d7d, #8b5cf6);
  border-radius: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 20px 40px rgba(255, 77, 125, 0.3);
  animation: bounce 3s infinite ease-in-out;
  position: relative;
}

.icon-wrapper::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 30px;
  background: inherit;
  opacity: 0.5;
  filter: blur(20px);
  z-index: -1;
  animation: pulseGlow 2s infinite;
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.1); }
}

@keyframes bounce {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-15px) rotate(5deg); }
}

.icon-wrapper i {
  font-size: 60px;
  color: white;
  filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2));
}

h1 {
  font-size: 3.8rem;
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 20px;
  background: linear-gradient(135deg, #ff4d7d, #8b5cf6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 5px 15px rgba(255, 77, 125, 0.2);
  animation: titleGlow 3s infinite alternate;
}

@keyframes titleGlow {
  0% { filter: drop-shadow(0 5px 15px rgba(255, 77, 125, 0.2)); }
  100% { filter: drop-shadow(0 5px 25px rgba(139, 92, 246, 0.4)); }
}

.highlight {
  background: linear-gradient(135deg, #ff4d7d, #8b5cf6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800;
}

p {
  font-size: 1.2rem;
  color: #4a5568;
  margin-bottom: 50px;
  line-height: 1.6;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
  font-weight: 400;
}

.feature-tags {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 40px;
  flex-wrap: wrap;
}

.tag {
  padding: 8px 20px;
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(5px);
  border-radius: 40px;
  font-size: 14px;
  font-weight: 500;
  color: #4a5568;
  border: 1px solid rgba(255, 255, 255, 0.8);
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s;
  animation: fadeInTag 0.8s ease forwards;
  opacity: 0;
  transform: translateY(20px);
}

.tag:nth-child(1) { animation-delay: 0.2s; }
.tag:nth-child(2) { animation-delay: 0.4s; }
.tag:nth-child(3) { animation-delay: 0.6s; }

@keyframes fadeInTag {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.tag:hover {
  background: white;
  transform: translateY(-3px);
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.tag i {
  color: #ff4d7d;
  font-size: 14px;
}

.start-btn {
  padding: 18px 50px;
  font-size: 20px;
  font-weight: 700;
  border: none;
  border-radius: 60px;
  background: linear-gradient(135deg, #ff4d7d, #8b5cf6);
  color: white;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 15px 35px rgba(255, 77, 125, 0.3);
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  letter-spacing: 0.5px;
}

.start-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.7s;
}

.start-btn:hover {
  transform: translateY(-5px) scale(1.05);
  box-shadow: 0 25px 45px rgba(255, 77, 125, 0.4);
}

.start-btn:hover::before {
  left: 100%;
}

.start-btn i {
  font-size: 22px;
  transition: transform 0.3s;
}

.start-btn:hover i {
  transform: translateX(8px) rotate(10deg);
}

.footer {
  position: absolute;
  bottom: 30px;
  font-size: 14px;
  color: #718096;
  display: flex;
  gap: 30px;
  align-items: center;
  z-index: 10;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(10px);
  padding: 10px 25px;
  border-radius: 50px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  animation: slideUp 1s ease 0.8s forwards;
  opacity: 0;
  transform: translateY(20px);
}

@keyframes slideUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.footer span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.footer i {
  color: #ff4d7d;
  font-size: 14px;
  animation: heartBeat 1.5s infinite;
}

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.2); }
  50% { transform: scale(1); }
  75% { transform: scale(1.1); }
}

@media (max-width: 768px) {
  .hero-card {
    padding: 50px 30px;
  }
  h1 {
    font-size: 2.5rem;
  }
  .icon-wrapper {
    width: 90px;
    height: 90px;
  }
  .icon-wrapper i {
    font-size: 45px;
  }
  .feature-tags {
    gap: 10px;
  }
  .tag {
    padding: 6px 15px;
    font-size: 12px;
  }
  .start-btn {
    padding: 15px 35px;
    font-size: 18px;
  }
  .footer {
    flex-direction: column;
    gap: 10px;
    padding: 10px 20px;
  }
}

.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<!-- ── New dark background ── -->
<div class="bg-canvas">
  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-2"></div>
  <div class="aurora aurora-3"></div>
  <div class="aurora aurora-4"></div>
  <canvas class="stars" id="starsCanvas"></canvas>
</div>

<!-- Floating particles (generated by JavaScript) -->
<div id="particles"></div>

<div class="hero-card">
  <div class="icon-wrapper">
    <i class="fas fa-wand-magic-sparkles"></i>
  </div>
  
  <h1>GiftGenie AI</h1>
  <p>Discover meaningful, personalized gift ideas powered by <span class="highlight">intelligent AI</span> recommendations that truly understand your loved ones.</p>
  
  <!-- Feature tags for visual appeal -->
  <div class="feature-tags">
    <div class="tag">
      <i class="fas fa-brain"></i> AI-Powered
    </div>
    <div class="tag">
      <i class="fas fa-heart"></i> Personalized
    </div>
    <div class="tag">
      <i class="fas fa-gift"></i> Curated Ideas
    </div>
  </div>

  <form action="{{ url_for('form') }}" method="get" id="startForm">
    <button class="start-btn" type="submit" id="startBtn">
      <span>Start Finding Gifts</span>
      <i class="fas fa-arrow-right"></i>
    </button>
  </form>
</div>


<script>
/* ── Star canvas ── */
const canvas = document.getElementById('starsCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const stars = Array.from({length: 160}, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 1.5 + 0.3,
  a: Math.random(),
  speed: Math.random() * 0.008 + 0.003,
  phase: Math.random() * Math.PI * 2
}));

function drawStars(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    const alpha = s.a * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars(0);

/* ── Floating emoji gifts ── */
const emojis = ['🎁','🎀','✨','🌟','💝','💫','🪄'];
function spawnEmoji() {
  const el = document.createElement('div');
  el.className = 'float-emoji';
  el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  el.style.left = Math.random() * 95 + 'vw';
  el.style.fontSize = (18 + Math.random() * 18) + 'px';
  const dur = 9 + Math.random() * 10;
  el.style.animationDuration = dur + 's';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), dur * 1000);
}
setInterval(spawnEmoji, 1200);
for (let i = 0; i < 5; i++) setTimeout(spawnEmoji, i * 400);

/* ── Aurora parallax ── */
document.addEventListener('mousemove', (e) => {
  const blobs = document.querySelectorAll('.aurora');
  const mouseX = e.clientX / window.innerWidth;
  const mouseY = e.clientY / window.innerHeight;
  blobs.forEach((blob, index) => {
    const speed = (index + 1) * 20;
    const x = (mouseX - 0.5) * speed;
    const y = (mouseY - 0.5) * speed;
    blob.style.transform = `translate(${x}px, ${y}px)`;
  });
});

// Interactive hover effect on hero card
const heroCard = document.querySelector('.hero-card');
heroCard.addEventListener('mousemove', (e) => {
  const rect = heroCard.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  const centerX = rect.width / 2;
  const centerY = rect.height / 2;
  
  const rotateX = (y - centerY) / 30;
  const rotateY = (centerX - x) / 30;
  
  heroCard.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
});

heroCard.addEventListener('mouseleave', () => {
  heroCard.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
});

// Form submission animation
const form = document.getElementById('startForm');
const startBtn = document.getElementById('startBtn');

form.addEventListener('submit', function(e) {
  e.preventDefault();
  
  const originalHTML = startBtn.innerHTML;
  startBtn.innerHTML = '<span class="loading"></span> Finding gifts...';
  startBtn.disabled = true;
  
  setTimeout(() => {
    window.location.href = startBtn.closest('form').action;
  }, 1500);
});

// Initialize particles (original code kept)
function createParticles() {
  const particlesContainer = document.getElementById('particles');
  const particleCount = 30;
  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    const size = Math.random() * 4 + 2;
    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;
    particle.style.left = `${Math.random() * 100}%`;
    particle.style.top = `${Math.random() * 100}%`;
    const duration = Math.random() * 10 + 10;
    const delay = Math.random() * 5;
    particle.style.animation = `float ${duration}s infinite alternate ease-in-out ${delay}s`;
    particle.style.opacity = Math.random() * 0.3 + 0.2;
    particlesContainer.appendChild(particle);
  }
}
createParticles();

window.addEventListener('load', () => {
  const tags = document.querySelectorAll('.tag');
  tags.forEach((tag, index) => {
    setTimeout(() => {
      tag.style.opacity = '1';
      tag.style.transform = 'translateY(0)';
    }, 200 + index * 100);
  });
});
</script>

</body>
</html>
